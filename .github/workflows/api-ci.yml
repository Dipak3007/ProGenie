name: api-ci

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-ci.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: mvn -B verify
