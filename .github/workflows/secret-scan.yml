name: secret-scan

# Fails the build if a password, key or token is committed (gitleaks, all history on push to main).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan with gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          BASELINE_TAG: ProGenie1.0
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif git rev-parse -q --verify "refs/tags/$BASELINE_TAG" >/dev/null; then
            range="$BASELINE_TAG..HEAD"
          else
            echo "::warning::Tag $BASELINE_TAG not found, so the whole history is scanned. Create it on the last commit of the old project."
            range="HEAD"
          fi
          echo "Scanning commits in: $range ($(git rev-list --count "$range") commits)"
          ./gitleaks git --redact --verbose --log-opts="$range" .