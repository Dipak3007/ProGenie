# ProGenie API: every SQL statement the API runs, looked up by key through QueryUtil.get(QueryConstants.X).
#
# Conventions
#   key            verb.entity.detail, e.g. get.genie.list. Verbs: get, count, exists, lock (SELECT ... FOR UPDATE),
#                  insert, upsert (INSERT ... ON CONFLICT DO UPDATE), update, delete. Every key has a constant in
#                  com.progenie.shared.config.QueryConstants with the same name in UPPER_SNAKE_CASE.
#   fragment.*     a reusable piece of SQL (a shared SELECT list, a WHERE clause, a sort order). It is never run on its own.
#   ${other.key}   includes another entry, resolved once when the file is loaded.
#   {{slot}}       filled at runtime with ANOTHER KEY from this file (never with user input), e.g. a sort order;
#                  see QueryUtil.get(key, slots). Values always travel as bind parameters (:name).
#   One line       every statement is written on a single line (no " \" line continuations).
#   Non-ASCII      write it as a \uXXXX escape so every editor and loader reads the file the same way.
#
# QueryUtilTest fails the build if a constant has no entry, an entry has no constant, or an include is missing.


# ====================================================================================================
# Shared: job locks, rate limits, reusable fragments
# ====================================================================================================

lock.job.advisory=SELECT pg_try_advisory_xact_lock(hashtext(:name))

fragment.none=

upsert.rate-limit.hit=INSERT INTO rate_limit_counters (key, window_start, hits) VALUES (:key, :start, 1) ON CONFLICT (key, window_start) DO UPDATE SET hits = rate_limit_counters.hits + 1 RETURNING hits
delete.rate-limit.key=DELETE FROM rate_limit_counters WHERE key = :key
delete.rate-limit.old-windows=DELETE FROM rate_limit_counters WHERE window_start < now() - interval '1 day'

# ====================================================================================================
# Analytics (admin overview, Genie stats)
# ====================================================================================================

get.analytics.bookings-by-status=SELECT status, count(*) AS count FROM bookings WHERE created_at >= :from AND created_at < :to GROUP BY status ORDER BY count(*) DESC
get.analytics.daily-series=WITH days AS ( SELECT d::date AS day FROM generate_series(CAST(:fromDay AS date), CAST(:toDay AS date), interval '1 day') d ) SELECT days.day, (SELECT count(*) FROM bookings b WHERE (CAST(:g AS uuid) IS NULL OR b.genie_id = :g) AND (b.created_at AT TIME ZONE :tz)::date = days.day) AS bookings, (SELECT count(*) FROM bookings b WHERE (CAST(:g AS uuid) IS NULL OR b.genie_id = :g) AND b.status = 'COMPLETED' AND (b.completed_at AT TIME ZONE :tz)::date = days.day) AS completed, (SELECT coalesce(sum(b.total_amount), 0) FROM bookings b WHERE (CAST(:g AS uuid) IS NULL OR b.genie_id = :g) AND b.status = 'COMPLETED' AND (b.completed_at AT TIME ZONE :tz)::date = days.day) AS gmv FROM days ORDER BY days.day
get.analytics.genie-earnings=SELECT coalesce(sum(amount), 0) FROM ledger_entries WHERE genie_id = :g AND direction = 'C' AND account IN ('GENIE_EARNINGS', 'TIPS') AND created_at >= :from AND created_at < :to
get.analytics.genie-job-counts=SELECT count(*) AS requests, count(*) FILTER (WHERE status = 'COMPLETED') AS completed, count(*) FILTER (WHERE status = 'CANCELLED' AND cancelled_by = :g) AS cancelled, count(*) FILTER (WHERE accepted_at IS NOT NULL OR status IN ('REJECTED', 'EXPIRED')) AS responded, count(*) FILTER (WHERE accepted_at IS NOT NULL) AS accepted FROM bookings WHERE genie_id = :g AND created_at >= :from AND created_at < :to
get.analytics.genie-rating=SELECT avg_rating, rating_count FROM genie_profiles WHERE user_id = :g
get.analytics.money-totals=SELECT count(*) AS completed, coalesce(sum(total_amount), 0) AS gmv, coalesce(sum(commission_amount), 0) AS commission FROM bookings WHERE status = 'COMPLETED' AND completed_at >= :from AND completed_at < :to
get.analytics.people-totals=SELECT (SELECT count(*) FROM users WHERE role = 'CUSTOMER' AND created_at >= :from AND created_at < :to) AS new_customers, (SELECT count(*) FROM users WHERE role = 'GENIE' AND created_at >= :from AND created_at < :to) AS new_genies, (SELECT count(*) FROM genie_profiles WHERE verification_status = 'APPROVED') AS approved_genies, (SELECT count(*) FROM genie_profiles WHERE verification_status = 'UNDER_REVIEW') AS pending_verifications, (SELECT count(*) FROM genie_profiles WHERE flagged_at IS NOT NULL) AS flagged_genies, (SELECT count(*) FROM bookings WHERE cancellation_fee_status = 'DUE') AS outstanding_fees
get.analytics.response-stats=SELECT count(*) FILTER (WHERE accepted_at IS NOT NULL OR status IN ('REJECTED', 'EXPIRED')) AS responded, count(*) FILTER (WHERE accepted_at IS NOT NULL) AS accepted FROM bookings WHERE created_at >= :from AND created_at < :to
get.analytics.top-categories=SELECT c.slug, c.name, count(*) AS completed, sum(b.total_amount) AS gmv FROM bookings b JOIN services s ON s.id = b.service_id JOIN service_categories c ON c.id = s.category_id WHERE b.status = 'COMPLETED' AND b.completed_at >= :from AND b.completed_at < :to GROUP BY c.slug, c.name ORDER BY count(*) DESC, sum(b.total_amount) DESC LIMIT 5
get.analytics.top-genies=SELECT u.id, u.full_name AS name, count(*) AS completed, gp.avg_rating, sum(b.genie_payout) AS earnings FROM bookings b JOIN users u ON u.id = b.genie_id JOIN genie_profiles gp ON gp.user_id = b.genie_id WHERE b.status = 'COMPLETED' AND b.completed_at >= :from AND b.completed_at < :to GROUP BY u.id, u.full_name, gp.avg_rating ORDER BY count(*) DESC, gp.avg_rating DESC LIMIT 5

# ====================================================================================================
# Bookings
# ====================================================================================================

fragment.booking.admin-search-where=WHERE (CAST(:status AS varchar) IS NULL OR b.status = :status) AND (CAST(:from AS timestamptz) IS NULL OR b.slot_start >= :from) AND (CAST(:to AS timestamptz) IS NULL OR b.slot_start < :to) AND (CAST(:q AS varchar) IS NULL OR b.booking_ref ILIKE :q OR g.full_name ILIKE :q OR cu.full_name ILIKE :q OR g.phone LIKE :q OR cu.phone LIKE :q)
fragment.booking.counterpart-both=g.full_name || ' \u2192 ' || cu.full_name
fragment.booking.counterpart-customer=split_part(cu.full_name, ' ', 1)
fragment.booking.counterpart-genie=g.full_name
fragment.booking.order-latest=ORDER BY b.slot_start DESC
fragment.booking.order-soonest=ORDER BY b.slot_start ASC
fragment.booking.owner-customer=b.customer_id = :owner
fragment.booking.owner-genie=b.genie_id = :owner
fragment.booking.scope-active=AND b.status IN ('REQUESTED', 'ACCEPTED', 'IN_PROGRESS')
fragment.booking.scope-all=
fragment.booking.scope-past=AND b.status IN ('COMPLETED', 'REJECTED', 'EXPIRED', 'CANCELLED')
fragment.booking.scope-requests=AND b.status = 'REQUESTED'
fragment.booking.scope-upcoming=AND b.status IN ('ACCEPTED', 'IN_PROGRESS')
fragment.booking.summary-select=SELECT b.id, b.booking_ref, b.status, s.name AS service_name, c.slug AS category_slug, {{counterpart}} AS counterpart_name, b.slot_start, b.slot_end, b.total_amount, b.payment_method, b.payment_status, b.address_snapshot ->> 'area' AS area, b.cancellation_fee_status, EXISTS (SELECT 1 FROM reviews r WHERE r.booking_id = b.id) AS reviewed FROM bookings b JOIN services s           ON s.id = b.service_id JOIN service_categories c ON c.id = s.category_id JOIN users g              ON g.id = b.genie_id JOIN users cu             ON cu.id = b.customer_id
get.booking.active-slots=SELECT slot_start, slot_end FROM bookings WHERE genie_id = :g AND status IN ('REQUESTED', 'ACCEPTED', 'IN_PROGRESS') AND slot_start < :to AND slot_end > :from AND (CAST(:exclude AS uuid) IS NULL OR id <> :exclude)
get.booking.admin-search=${fragment.booking.summary-select} ${fragment.booking.admin-search-where} ORDER BY b.created_at DESC LIMIT :limit OFFSET :offset
get.booking.detail=SELECT b.id, b.booking_ref, b.status, b.customer_id, b.genie_id, b.service_id, s.name AS service_name, c.name AS category_name, c.slug AS category_slug, g.full_name AS genie_name, g.phone AS genie_phone, gp.avg_rating AS genie_rating, cu.full_name AS customer_name, cu.phone AS customer_phone, b.address_snapshot ->> 'label' AS addr_label, b.address_snapshot ->> 'line1' AS addr_line1, b.address_snapshot ->> 'line2' AS addr_line2, b.address_snapshot ->> 'landmark' AS addr_landmark, b.address_snapshot ->> 'area' AS addr_area, b.address_snapshot ->> 'city' AS addr_city, b.address_snapshot ->> 'pincode' AS addr_pincode, b.slot_start, b.slot_end, b.expires_at, b.notes, b.service_amount, b.extra_amount, b.extra_note, b.distance_km, b.travel_fee, b.tip_amount, b.total_amount, b.commission_amount, b.genie_payout, b.payment_method, b.payment_status, b.cancellation_fee, b.cancellation_fee_status, b.cancel_reason, cb.role AS cancelled_by_role, b.rescheduled_count, EXISTS (SELECT 1 FROM reviews r WHERE r.booking_id = b.id) AS reviewed, b.created_at, b.accepted_at, b.started_at, b.completed_at, b.cancelled_at FROM bookings b JOIN services s            ON s.id = b.service_id JOIN service_categories c  ON c.id = s.category_id JOIN users g               ON g.id = b.genie_id JOIN genie_profiles gp     ON gp.user_id = b.genie_id JOIN users cu              ON cu.id = b.customer_id LEFT JOIN users cb         ON cb.id = b.cancelled_by WHERE b.id = :id
get.booking.list=${fragment.booking.summary-select} WHERE {{owner}} {{scope}} {{orderBy}} LIMIT :limit OFFSET :offset
get.booking.next-ref=SELECT nextval('booking_ref_seq')
get.booking.reviewable=SELECT id AS booking_id, genie_id, status, completed_at FROM bookings WHERE id = :id AND customer_id = :c
get.booking.status-history=SELECT h.from_status, h.to_status, coalesce(u.role, 'SYSTEM') AS actor_role, h.reason, h.changed_at FROM booking_status_history h LEFT JOIN users u ON u.id = h.changed_by WHERE h.booking_id = :id ORDER BY h.changed_at, h.id
count.booking.admin-search=SELECT count(*) FROM bookings b JOIN users g ON g.id = b.genie_id JOIN users cu ON cu.id = b.customer_id ${fragment.booking.admin-search-where}
count.booking.list=SELECT count(*) FROM bookings b WHERE {{owner}} {{scope}}
count.booking.recent-genie-cancellations=SELECT count(*) FROM bookings WHERE genie_id = :g AND cancelled_by = :g AND status = 'CANCELLED' AND cancelled_at > :since
exists.booking.outstanding-fee=SELECT EXISTS (SELECT 1 FROM bookings WHERE customer_id = :c AND cancellation_fee_status = 'DUE')
lock.booking.due-reminders=SELECT id, booking_ref, customer_id, genie_id, slot_start FROM bookings WHERE status = 'ACCEPTED' AND reminder_sent_at IS NULL AND slot_start > :now AND slot_start <= :until ORDER BY slot_start LIMIT 200 FOR UPDATE SKIP LOCKED
lock.booking.expired-requests=SELECT id FROM bookings WHERE status = 'REQUESTED' AND expires_at <= :now ORDER BY expires_at LIMIT :batch FOR UPDATE SKIP LOCKED
insert.booking.status-history=INSERT INTO booking_status_history (booking_id, from_status, to_status, changed_by, reason) VALUES (:id, :from, :to, :actor, :reason)
update.booking.clear-reminder=UPDATE bookings SET reminder_sent_at = NULL WHERE id = :id
update.booking.copy-address-from-original=UPDATE bookings r SET address_snapshot = o.address_snapshot, customer_location = o.customer_location FROM bookings o WHERE r.id = :redo AND o.id = :original
update.booking.reminder-sent=UPDATE bookings SET reminder_sent_at = now() WHERE id = :id
update.booking.snapshot-address=UPDATE bookings b SET address_snapshot = jsonb_build_object( 'label', a.label, 'line1', a.line1, 'line2', a.line2, 'landmark', a.landmark, 'area', a.area, 'city', c.name, 'pincode', a.pincode), customer_location = a.location FROM addresses a JOIN cities c ON c.id = a.city_id WHERE b.id = :bookingId AND a.id = :addressId

# ====================================================================================================
# Catalog and city pricing
# ====================================================================================================

fragment.catalog.admin-service-select=SELECT s.id, s.category_id, c.name AS category_name, s.slug, s.name, s.description, s.base_price, s.duration_minutes, s.is_active AS active, (SELECT count(*) FROM genie_services gs WHERE gs.service_id = s.id AND gs.is_active) AS genie_count FROM services s JOIN service_categories c ON c.id = s.category_id
fragment.catalog.category-select=SELECT c.id, c.slug, c.name, c.description, c.icon, c.image_url, count(s.id)       AS service_count, min(s.base_price) AS starting_price FROM service_categories c LEFT JOIN services s ON s.category_id = c.id AND s.is_active WHERE c.is_active
get.catalog.active-cities=SELECT id, name, state FROM cities WHERE is_active ORDER BY name
get.catalog.admin-categories=SELECT c.id, c.slug, c.name, c.description, c.icon, c.image_url, c.sort_order, c.is_active AS active, (SELECT count(*) FROM services s WHERE s.category_id = c.id) AS service_count FROM service_categories c ORDER BY c.sort_order, c.name
get.catalog.admin-service=${fragment.catalog.admin-service-select} WHERE s.id = :id
get.catalog.admin-services=${fragment.catalog.admin-service-select} WHERE (CAST(:c AS bigint) IS NULL OR s.category_id = :c) ORDER BY c.sort_order, s.base_price
get.catalog.categories=${fragment.catalog.category-select} GROUP BY c.id ORDER BY c.sort_order
get.catalog.category-by-slug=${fragment.catalog.category-select} AND c.slug = :slug GROUP BY c.id
get.catalog.category-services=SELECT s.id, s.slug, s.name, s.description, s.base_price, s.duration_minutes FROM services s WHERE s.category_id = :categoryId AND s.is_active ORDER BY s.base_price
get.catalog.city-pricing=SELECT c.id AS city_id, c.name, c.state, c.is_active AS active, p.commission_rate, p.travel_free_km, p.travel_base_fee, p.travel_per_km, p.travel_fee_cap, p.currency FROM cities c LEFT JOIN city_pricing p ON p.city_id = c.id ORDER BY c.name
get.catalog.search-services=SELECT s.id AS service_id, s.slug AS service_slug, s.name AS service_name, c.slug AS category_slug, c.name AS category_name, s.base_price, s.duration_minutes FROM services s JOIN service_categories c ON c.id = s.category_id AND c.is_active WHERE s.is_active AND (s.search_vector @@ plainto_tsquery('simple', :q) OR s.name ILIKE :like OR c.name ILIKE :like OR s.description ILIKE :like) ORDER BY ts_rank(s.search_vector, plainto_tsquery('simple', :q)) DESC, (s.name ILIKE :like) DESC, c.sort_order, s.base_price LIMIT :limit
exists.catalog.category=SELECT EXISTS (SELECT 1 FROM service_categories WHERE id = :id)
exists.catalog.city=SELECT EXISTS (SELECT 1 FROM cities WHERE id = :id)
insert.catalog.category=INSERT INTO service_categories (slug, name, description, icon, image_url, sort_order, is_active) VALUES (:slug, :name, :description, :icon, :image, :sort, :active) RETURNING id
insert.catalog.service=INSERT INTO services (category_id, slug, name, description, base_price, duration_minutes, is_active) VALUES (:category, :slug, :name, :description, :price, :duration, :active) RETURNING id
upsert.catalog.city-pricing=INSERT INTO city_pricing (city_id, commission_rate, travel_free_km, travel_base_fee, travel_per_km, travel_fee_cap, updated_at) VALUES (:id, :rate, :free, :base, :perKm, :cap, now()) ON CONFLICT (city_id) DO UPDATE SET commission_rate = EXCLUDED.commission_rate, travel_free_km = EXCLUDED.travel_free_km, travel_base_fee = EXCLUDED.travel_base_fee, travel_per_km = EXCLUDED.travel_per_km, travel_fee_cap = EXCLUDED.travel_fee_cap, updated_at = now()
update.catalog.category=UPDATE service_categories SET slug = :slug, name = :name, description = :description, icon = :icon, image_url = :image, sort_order = :sort, is_active = :active WHERE id = :id
update.catalog.service=UPDATE services SET category_id = :category, slug = :slug, name = :name, description = :description, base_price = :price, duration_minutes = :duration, is_active = :active WHERE id = :id

# ====================================================================================================
# Customer addresses and favourites
# ====================================================================================================

fragment.address.select=SELECT a.id, a.label, a.line1, a.line2, a.landmark, a.area, a.city_id, c.name AS city_name, a.pincode, ST_Y(a.location::geometry) AS lat, ST_X(a.location::geometry) AS lng, a.is_default FROM addresses a JOIN cities c ON c.id = a.city_id
get.address.list=${fragment.address.select} WHERE a.user_id = :userId ORDER BY a.is_default DESC, a.created_at DESC
get.address.owned=${fragment.address.select} WHERE a.user_id = :userId AND a.id = :id
count.address.by-user=SELECT count(*) FROM addresses WHERE user_id = :userId
exists.address.active-city=SELECT EXISTS (SELECT 1 FROM cities WHERE id = :id AND is_active)
insert.address.create=INSERT INTO addresses (user_id, label, line1, line2, landmark, area, city_id, pincode, location, is_default) VALUES (:userId, :label, :line1, :line2, :landmark, :area, :cityId, :pincode, ST_SetSRID(ST_MakePoint(:lng, :lat), 4326)::geography, :isDefault) RETURNING id
update.address.clear-default=UPDATE addresses SET is_default = FALSE WHERE user_id = :userId AND is_default
update.address.details=UPDATE addresses SET label = :label, line1 = :line1, line2 = :line2, landmark = :landmark, area = :area, city_id = :cityId, pincode = :pincode, location = ST_SetSRID(ST_MakePoint(:lng, :lat), 4326)::geography, is_default = :isDefault WHERE id = :id AND user_id = :userId
update.address.promote-oldest-default=UPDATE addresses SET is_default = TRUE WHERE id = (SELECT id FROM addresses WHERE user_id = :userId ORDER BY created_at DESC LIMIT 1)
update.address.set-default=UPDATE addresses SET is_default = TRUE WHERE id = :id AND user_id = :userId
delete.address.owned=DELETE FROM addresses WHERE id = :id AND user_id = :userId

get.favourite.genie-ids=SELECT genie_id FROM favourites WHERE customer_id = :id ORDER BY created_at DESC
insert.favourite.add=INSERT INTO favourites (customer_id, genie_id) VALUES (:c, :g) ON CONFLICT DO NOTHING
delete.favourite.remove=DELETE FROM favourites WHERE customer_id = :c AND genie_id = :g

# ====================================================================================================
# Accounts, sign-in, OTP, privacy (export and deletion), retention
# ====================================================================================================

fragment.deletion.status-filter=WHERE (CAST(:s AS varchar) IS NULL OR d.status = :s)
get.deletion.admin-list=SELECT d.id, d.user_id, u.full_name, u.role, d.status, d.reason, d.requested_at, d.scheduled_for, d.completed_at, d.note FROM deletion_requests d JOIN users u ON u.id = d.user_id ${fragment.deletion.status-filter} ORDER BY d.requested_at DESC LIMIT :limit OFFSET :offset
get.deletion.export-file-keys=SELECT file_key FROM data_export_jobs WHERE user_id = :u AND file_key IS NOT NULL
get.deletion.genie-balance=SELECT coalesce(sum(CASE direction WHEN 'C' THEN amount ELSE -amount END), 0) FROM ledger_entries WHERE genie_id = :u AND account IN ('GENIE_EARNINGS', 'TIPS', 'GENIE_CASH', 'PAYOUT', 'SETTLEMENT')
get.deletion.scheduled=SELECT id, status, requested_at, scheduled_for FROM deletion_requests WHERE user_id = :u AND status = 'SCHEDULED'
get.deletion.scheduled-for=SELECT scheduled_for FROM deletion_requests WHERE user_id = :u AND status = 'SCHEDULED'
count.deletion.admin-list=SELECT count(*) FROM deletion_requests d ${fragment.deletion.status-filter}
count.deletion.open-tickets=SELECT count(*) FROM tickets t LEFT JOIN bookings b ON b.id = t.booking_id WHERE (t.raised_by = :u OR b.customer_id = :u OR b.genie_id = :u) AND t.status IN ('OPEN', 'IN_REVIEW', 'AWAITING_REPLY')
count.deletion.pending-payouts=SELECT count(*) FROM payouts WHERE genie_id = :u AND status = 'PENDING'
count.deletion.unpaid=SELECT count(*) FROM bookings WHERE customer_id = :u AND ((status = 'COMPLETED' AND payment_status = 'UNPAID') OR cancellation_fee_status = 'DUE')
count.deletion.upcoming-bookings=SELECT count(*) FROM bookings WHERE (customer_id = :u OR genie_id = :u) AND status IN ('REQUESTED', 'ACCEPTED', 'IN_PROGRESS')
exists.deletion.scheduled=SELECT EXISTS (SELECT 1 FROM deletion_requests WHERE user_id = :u AND status = 'SCHEDULED')
lock.deletion.due=SELECT id, user_id FROM deletion_requests WHERE status = 'SCHEDULED' AND scheduled_for <= now() ORDER BY scheduled_for LIMIT 50 FOR UPDATE SKIP LOCKED
insert.deletion.request=INSERT INTO deletion_requests (user_id, reason, scheduled_for) VALUES (:u, :r, :when) RETURNING id
update.deletion.blocked=UPDATE deletion_requests SET status = 'BLOCKED', note = :n WHERE id = :id
update.deletion.cancel=UPDATE deletion_requests SET status = 'CANCELLED', cancelled_at = now() WHERE user_id = :u AND status = 'SCHEDULED'
update.deletion.done=UPDATE deletion_requests SET status = 'DONE', completed_at = now() WHERE id = :id
update.deletion.redact-messages=UPDATE outbound_messages SET destination = '[deleted]', body = '[deleted]', params = '{}'::jsonb WHERE user_id = :u
update.deletion.retire-genie-profile=UPDATE genie_profiles SET bio = NULL, payout_upi_id = NULL, is_online = FALSE, verification_status = 'SUSPENDED', updated_at = now() WHERE user_id = :u
update.deletion.trim-booking-addresses=UPDATE bookings SET address_snapshot = jsonb_build_object('area', address_snapshot ->> 'area', 'city', address_snapshot ->> 'city', 'pincode', address_snapshot ->> 'pincode'), customer_location = NULL, notes = NULL WHERE customer_id = :u
delete.deletion.addresses=DELETE FROM addresses WHERE user_id = :u
delete.deletion.export-jobs=DELETE FROM data_export_jobs WHERE user_id = :u
delete.deletion.favourites=DELETE FROM favourites WHERE customer_id = :u
delete.deletion.genie-location=DELETE FROM genie_locations WHERE genie_id = :u
delete.deletion.notifications=DELETE FROM notifications WHERE user_id = :u
delete.deletion.reset-tokens=DELETE FROM password_reset_tokens WHERE user_id = :u

fragment.export.addresses=SELECT to_jsonb(a) - 'location' || jsonb_build_object('lat', ST_Y(a.location::geometry), 'lng', ST_X(a.location::geometry)) FROM addresses a WHERE a.user_id = :u
fragment.export.bookings=SELECT to_jsonb(b) - 'start_otp_hash' - 'customer_location' - 'idempotency_key' - 'commission_rate' - 'commission_amount' - 'genie_payout' - 'version' || jsonb_build_object('service', s.name, 'genie', g.full_name) FROM bookings b JOIN services s ON s.id = b.service_id JOIN users g ON g.id = b.genie_id WHERE b.customer_id = :u ORDER BY b.slot_start
fragment.export.consents=SELECT jsonb_build_object('document', c.kind, 'version', c.version, 'acceptedAt', c.accepted_at, 'ip', c.ip, 'browser', c.user_agent) FROM user_consents c WHERE c.user_id = :u ORDER BY c.accepted_at
fragment.export.favourites=SELECT jsonb_build_object('genie', g.full_name, 'addedAt', f.created_at) FROM favourites f JOIN users g ON g.id = f.genie_id WHERE f.customer_id = :u
fragment.export.genie-documents=SELECT jsonb_build_object('type', doc_type, 'maskedNumber', masked_number, 'status', status, 'uploadedAt', created_at) FROM genie_documents WHERE genie_id = :u
fragment.export.genie-earnings-ledger=SELECT jsonb_build_object('account', account, 'direction', direction, 'amount', amount, 'description', description, 'at', created_at) FROM ledger_entries WHERE genie_id = :u ORDER BY created_at
fragment.export.genie-jobs=SELECT jsonb_build_object('ref', b.booking_ref, 'service', s.name, 'slotStart', b.slot_start, 'status', b.status, 'serviceAmount', b.service_amount, 'travelFee', b.travel_fee, 'extraAmount', b.extra_amount, 'tip', b.tip_amount, 'commission', b.commission_amount, 'yourEarnings', b.genie_payout, 'area', b.address_snapshot ->> 'area') FROM bookings b JOIN services s ON s.id = b.service_id WHERE b.genie_id = :u ORDER BY b.slot_start
fragment.export.genie-payouts=SELECT to_jsonb(p) FROM payouts p WHERE p.genie_id = :u ORDER BY p.created_at
fragment.export.genie-profile=SELECT to_jsonb(gp) - 'base_location' || jsonb_build_object('baseLat', ST_Y(gp.base_location::geometry), 'baseLng', ST_X(gp.base_location::geometry)) FROM genie_profiles gp WHERE gp.user_id = :u
fragment.export.genie-reviews-received=SELECT jsonb_build_object('rating', rating, 'comment', comment, 'yourReply', genie_reply, 'createdAt', created_at) FROM reviews WHERE genie_id = :u ORDER BY created_at
fragment.export.job-select=SELECT id, status, size_bytes, requested_at, ready_at, expires_at, error FROM data_export_jobs
fragment.export.notification-preferences=SELECT to_jsonb(p) - 'user_id' FROM notification_preferences p WHERE p.user_id = :u
fragment.export.notifications=SELECT jsonb_build_object('title', title, 'body', body, 'createdAt', created_at, 'readAt', read_at) FROM notifications WHERE user_id = :u ORDER BY created_at
fragment.export.payments=SELECT to_jsonb(p) || jsonb_build_object('refunds', coalesce((SELECT jsonb_agg(jsonb_build_object( 'amount', r.amount, 'status', r.status, 'reason', r.reason, 'processedAt', r.processed_at)) FROM refunds r WHERE r.payment_id = p.id), '[]'::jsonb)) FROM payments p WHERE p.customer_id = :u ORDER BY p.created_at
fragment.export.profile=SELECT to_jsonb(u) - 'password_hash' - 'version' FROM users u WHERE u.id = :u
fragment.export.receipts=SELECT jsonb_build_object('number', number, 'kind', kind, 'amount', amount, 'issuedAt', issued_at) FROM receipts WHERE customer_id = :u ORDER BY issued_at
fragment.export.reviews-written=SELECT jsonb_build_object('rating', r.rating, 'comment', r.comment, 'genie', g.full_name, 'genieReply', r.genie_reply, 'createdAt', r.created_at) FROM reviews r JOIN users g ON g.id = r.genie_id WHERE r.customer_id = :u
fragment.export.tickets=SELECT jsonb_build_object('ref', t.ticket_ref, 'type', t.type, 'category', t.category, 'status', t.status, 'subject', t.subject, 'description', t.description, 'resolution', t.resolution_note, 'createdAt', t.created_at, 'messages', coalesce((SELECT jsonb_agg(jsonb_build_object('from', m.author_role, 'body', m.body, 'at', m.created_at) ORDER BY m.created_at) FROM ticket_messages m WHERE m.ticket_id = t.id AND NOT m.internal), '[]'::jsonb)) FROM tickets t WHERE t.raised_by = :u ORDER BY t.created_at
get.export.as-json-array=SELECT coalesce(jsonb_agg(x.j), '[]'::jsonb)::text FROM ({{query}}) AS x(j)
get.export.as-json-object=SELECT ({{query}})::text
get.export.download=SELECT status, file_key, expires_at, ready_at FROM data_export_jobs WHERE id = :id AND user_id = :u
get.export.expired=SELECT id, file_key FROM data_export_jobs WHERE status = 'READY' AND expires_at < now()
get.export.job=${fragment.export.job-select} WHERE id = :id AND user_id = :u
get.export.list=${fragment.export.job-select} WHERE user_id = :u ORDER BY requested_at DESC LIMIT 10
get.export.recent=${fragment.export.job-select} WHERE user_id = :u AND requested_at > now() - interval '24 hours' AND status IN ('PENDING', 'READY') ORDER BY requested_at DESC
lock.export.pending=SELECT id, user_id FROM data_export_jobs WHERE status = 'PENDING' ORDER BY requested_at LIMIT 5 FOR UPDATE SKIP LOCKED
insert.export.request=INSERT INTO data_export_jobs (user_id) VALUES (:u) RETURNING id
update.export.expire=UPDATE data_export_jobs SET status = 'EXPIRED', file_key = NULL WHERE id = :id
update.export.failed=UPDATE data_export_jobs SET status = 'FAILED', error = :e WHERE id = :id
update.export.ready=UPDATE data_export_jobs SET status = 'READY', file_key = :k, size_bytes = :size, ready_at = now(), expires_at = :exp WHERE id = :id

get.otp.last-sent-at=SELECT created_at FROM otp_challenges WHERE destination = :d ORDER BY created_at DESC LIMIT 1
lock.otp.challenge=SELECT id, user_id, purpose, channel, destination, code_hash, expires_at, attempts, consumed_at FROM otp_challenges WHERE id = :id FOR UPDATE
insert.otp.challenge=INSERT INTO otp_challenges (id, user_id, purpose, channel, destination, code_hash, expires_at, ip) VALUES (:id, :user, :purpose, :channel, :dest, :hash, :expires, :ip)
update.otp.attempts=UPDATE otp_challenges SET attempts = :a WHERE id = :id
update.otp.consumed=UPDATE otp_challenges SET consumed_at = :now WHERE id = :id
update.otp.expire-previous=UPDATE otp_challenges SET expires_at = :now WHERE destination = :dest AND purpose = :purpose AND consumed_at IS NULL AND expires_at > :now
delete.otp.for-user=DELETE FROM otp_challenges WHERE user_id = :u

lock.password-reset.token=SELECT user_id, expires_at, used_at FROM password_reset_tokens WHERE token_hash = :h FOR UPDATE
insert.password-reset.token=INSERT INTO password_reset_tokens (token_hash, user_id, expires_at) VALUES (:h, :u, :exp)
update.password-reset.used=UPDATE password_reset_tokens SET used_at = :now WHERE token_hash = :h
delete.password-reset.for-user=DELETE FROM password_reset_tokens WHERE user_id = :u

get.retention.expired-kyc-files=SELECT d.id, d.object_key FROM genie_documents d JOIN users u ON u.id = d.genie_id JOIN genie_profiles gp ON gp.user_id = d.genie_id WHERE (u.deleted_at IS NOT NULL AND u.deleted_at < now() - interval '30 days') OR (gp.verification_status = 'REJECTED' AND NOT EXISTS ( SELECT 1 FROM genie_verification_events e WHERE e.genie_id = d.genie_id AND e.created_at > now() - interval '180 days'))
get.retention.old-closed-tickets=SELECT id FROM tickets WHERE status = 'CLOSED' AND closed_at < now() - interval '3 years' LIMIT 500
update.retention.detach-refunds=UPDATE refunds SET ticket_id = NULL WHERE ticket_id = :t
update.retention.detach-strikes=UPDATE genie_strikes SET ticket_id = NULL WHERE ticket_id = :t
delete.retention.old-messages=DELETE FROM outbound_messages WHERE created_at < now() - interval '90 days' AND status <> 'PENDING'
delete.retention.old-otps=DELETE FROM otp_challenges WHERE expires_at < now() - interval '1 day'
delete.retention.old-reset-tokens=DELETE FROM password_reset_tokens WHERE expires_at < now() - interval '1 day'
delete.retention.old-webhook-events=DELETE FROM webhook_events WHERE received_at < now() - interval '90 days'

get.ticket.attachment-file-keys=SELECT file_key FROM ticket_attachments WHERE ticket_id = :t
delete.ticket.by-id=DELETE FROM tickets WHERE id = :t

fragment.user.search-where=WHERE (CAST(:role AS varchar) IS NULL OR u.role = :role) AND (CAST(:status AS varchar) IS NULL OR u.status = :status) AND (CAST(:q AS varchar) IS NULL OR u.full_name ILIKE :q OR u.phone LIKE :q OR u.email::text ILIKE :q)
get.user.has-verified-email=SELECT email IS NOT NULL AND email_verified FROM users WHERE id = :u
get.user.phone-verified=SELECT phone_verified FROM users WHERE id = :id
get.user.role=SELECT role FROM users WHERE id = :u
get.user.search=SELECT u.id, u.full_name, u.email, u.phone, u.role, u.status, u.created_at, (SELECT count(*) FROM bookings b WHERE b.customer_id = u.id OR b.genie_id = u.id) AS booking_count FROM users u ${fragment.user.search-where} ORDER BY u.created_at DESC LIMIT :limit OFFSET :offset
count.user.search=SELECT count(*) FROM users u ${fragment.user.search-where}
lock.user.by-id=SELECT id FROM users WHERE id = :u FOR UPDATE
update.user.password-locked-until=UPDATE users SET password_locked_until = :until WHERE id = :id

# ====================================================================================================
# Legal documents and consents
# ====================================================================================================

get.consent.history=SELECT c.kind, c.version, d.title, c.accepted_at FROM user_consents c JOIN legal_documents d ON d.id = c.document_id WHERE c.user_id = :u ORDER BY c.accepted_at DESC
get.consent.is-pending=SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM legal_documents WHERE kind = :k AND published_at IS NOT NULL) THEN FALSE WHEN a.max_version IS NULL THEN TRUE ELSE EXISTS (SELECT 1 FROM legal_documents d WHERE d.kind = :k AND d.published_at IS NOT NULL AND d.version > a.max_version AND d.requires_reacceptance) END FROM (SELECT max(version) AS max_version FROM user_consents WHERE user_id = :u AND kind = :k) a
insert.consent.accept=INSERT INTO user_consents (user_id, document_id, kind, version, ip, user_agent) SELECT :u, id, kind, version, :ip, :ua FROM legal_documents WHERE kind = :k AND published_at IS NOT NULL ORDER BY version DESC LIMIT 1 ON CONFLICT (user_id, document_id) DO NOTHING

fragment.legal.document-select=SELECT id, kind, version, title, body, change_summary, requires_reacceptance, effective_from, published_at, updated_at FROM legal_documents
get.legal.admin-list=${fragment.legal.document-select} ORDER BY kind, version DESC
get.legal.current=${fragment.legal.document-select} WHERE kind = :k AND published_at IS NOT NULL ORDER BY version DESC LIMIT 1
get.legal.document=${fragment.legal.document-select} WHERE id = :id
get.legal.draft=${fragment.legal.document-select} WHERE kind = :k AND published_at IS NULL
get.legal.version=${fragment.legal.document-select} WHERE kind = :k AND version = :v AND published_at IS NOT NULL
get.legal.versions=SELECT version, title, change_summary, requires_reacceptance, effective_from, published_at FROM legal_documents WHERE kind = :k AND published_at IS NOT NULL ORDER BY version DESC
lock.legal.document=${fragment.legal.document-select} WHERE id = :id FOR UPDATE
lock.legal.draft=SELECT pg_advisory_xact_lock(hashtext(:k))
insert.legal.draft=INSERT INTO legal_documents (kind, version, title, body, change_summary, requires_reacceptance, effective_from, created_by) SELECT :k, coalesce(max(version), 0) + 1, :title, :body, :summary, :re, :eff, :admin FROM legal_documents WHERE kind = :k
update.legal.draft=UPDATE legal_documents SET title = :title, body = :body, change_summary = :summary, requires_reacceptance = :re, effective_from = :eff, updated_at = now() WHERE kind = :k AND published_at IS NULL
update.legal.publish=UPDATE legal_documents SET published_at = now(), effective_from = coalesce(effective_from, CURRENT_DATE) WHERE id = :id
delete.legal.draft=DELETE FROM legal_documents WHERE kind = :k AND published_at IS NULL

# ====================================================================================================
# Notifications and outgoing messages
# ====================================================================================================

fragment.message.list-where=WHERE (CAST(:status AS varchar) IS NULL OR status = :status) AND (CAST(:channel AS varchar) IS NULL OR channel = :channel) AND (CAST(:q AS varchar) IS NULL OR template ILIKE :q OR destination ILIKE :q OR subject ILIKE :q)
get.message.body=SELECT body FROM outbound_messages WHERE id = :id
get.message.booking-context=SELECT b.booking_ref, s.name AS service, cu.full_name AS customer, gu.full_name AS genie, coalesce(b.address_snapshot ->> 'area', b.address_snapshot ->> 'city', '') AS area, b.total_amount, b.cancellation_fee, b.cancellation_fee_status, b.payment_method, b.payment_status FROM bookings b JOIN services s ON s.id = b.service_id JOIN users cu ON cu.id = b.customer_id JOIN users gu ON gu.id = b.genie_id WHERE b.id = :id
get.message.list=SELECT id, channel, template, destination, subject, body, status, attempts, provider, delivery_status, last_error, created_at, sent_at, delivered_at FROM outbound_messages ${fragment.message.list-where} ORDER BY created_at DESC LIMIT :limit OFFSET :offset
count.message.list=SELECT count(*) FROM outbound_messages ${fragment.message.list-where}
lock.message.status=SELECT status FROM outbound_messages WHERE id = :id FOR UPDATE
insert.message.enqueue=INSERT INTO outbound_messages (user_id, channel, template, destination, subject, body, params, sensitive, attachment_key, attachment_name, dedupe_key) VALUES (:user, :channel, :template, :dest, :subject, :body, CAST(:params AS jsonb), :sensitive, :attKey, :attName, :dedupe) ON CONFLICT (dedupe_key) DO NOTHING
update.message.claim-due=UPDATE outbound_messages m SET attempts = m.attempts + 1, next_attempt_at = now() + make_interval(secs => :lease) WHERE m.id IN (SELECT id FROM outbound_messages WHERE status = 'PENDING' AND next_attempt_at <= now() ORDER BY next_attempt_at LIMIT :limit FOR UPDATE SKIP LOCKED) RETURNING m.id, m.channel, m.template, m.destination, m.subject, m.body, m.params::text AS params, m.attachment_key, m.attachment_name, m.attempts
update.message.delivery-report=UPDATE outbound_messages SET delivery_status = :s, delivered_at = CASE WHEN :delivered THEN coalesce(delivered_at, now()) ELSE delivered_at END WHERE provider = :p AND provider_message_id = :pid
update.message.failed=UPDATE outbound_messages SET status = 'FAILED', provider = :provider, last_error = :error, body = CASE WHEN sensitive THEN '[redacted]' ELSE body END, params = CASE WHEN sensitive THEN '{}'::jsonb ELSE params END WHERE id = :id
update.message.reschedule=UPDATE outbound_messages SET provider = :provider, last_error = :error, next_attempt_at = now() + make_interval(secs => :delay) WHERE id = :id
update.message.retry=UPDATE outbound_messages SET status = 'PENDING', attempts = 0, next_attempt_at = now(), last_error = NULL WHERE id = :id
update.message.sent=UPDATE outbound_messages SET status = 'SENT', provider = :provider, provider_message_id = :pid, sent_at = now(), last_error = NULL, body = CASE WHEN sensitive THEN '[redacted]' ELSE body END, params = CASE WHEN sensitive THEN '{}'::jsonb ELSE params END WHERE id = :id

fragment.notification.unread-only=AND read_at IS NULL
get.notification.list=SELECT id, type, title, body, link, read_at, created_at FROM notifications WHERE user_id = :u {{unread}} ORDER BY created_at DESC LIMIT :limit OFFSET :offset
count.notification.list=SELECT count(*) FROM notifications WHERE user_id = :u {{unread}}
count.notification.unread=SELECT count(*) FROM notifications WHERE user_id = :u AND read_at IS NULL
insert.notification.create=INSERT INTO notifications (user_id, type, title, body, link) VALUES (:u, :type, :title, :body, :link)
insert.notification.for-admins=INSERT INTO notifications (user_id, type, title, body, link) SELECT id, :type, :title, :body, :link FROM users WHERE role = 'ADMIN' AND status = 'ACTIVE'
update.notification.mark-all-read=UPDATE notifications SET read_at = now() WHERE user_id = :u AND read_at IS NULL
update.notification.mark-read=UPDATE notifications SET read_at = now() WHERE id = :id AND user_id = :u AND read_at IS NULL

get.notification-preference.all=SELECT category, sms, whatsapp, email FROM notification_preferences WHERE user_id = :u
get.notification-preference.one=SELECT category, sms, whatsapp, email FROM notification_preferences WHERE user_id = :u AND category = :c
upsert.notification-preference.save=INSERT INTO notification_preferences (user_id, category, sms, whatsapp, email) VALUES (:u, :c, :sms, :wa, :email) ON CONFLICT (user_id, category) DO UPDATE SET sms = EXCLUDED.sms, whatsapp = EXCLUDED.whatsapp, email = EXCLUDED.email, updated_at = now()
delete.notification-preference.all=DELETE FROM notification_preferences WHERE user_id = :u

get.user.active-admin-ids=SELECT id FROM users WHERE role = 'ADMIN' AND status = 'ACTIVE'
get.user.contact=SELECT id, full_name, phone, email, email_verified, status FROM users WHERE id = :id

# ====================================================================================================
# Payments, refunds, receipts, ledger, wallet, payouts
# ====================================================================================================

upsert.document-sequence.next=INSERT INTO document_sequences (series, fiscal_year, next_value) VALUES (:s, :fy, 2) ON CONFLICT (series, fiscal_year) DO UPDATE SET next_value = document_sequences.next_value + 1 RETURNING next_value - 1

insert.ledger.entry=INSERT INTO ledger_entries (booking_id, genie_id, account, direction, amount, description, payout_id, refund_id) VALUES (:booking, :genie, :account, :direction, :amount, :description, :payout, :refund)

get.payment.admin-list=SELECT p.id, p.purpose, p.method, p.provider, p.amount, p.status, p.failure_reason, p.created_at, (SELECT coalesce(sum(r.amount), 0) FROM refunds r WHERE r.payment_id = p.id AND r.status = 'PROCESSED') AS refunded_amount FROM payments p WHERE p.booking_id = :b ORDER BY p.created_at DESC
get.payment.by-id=SELECT p.id, p.purpose, p.method, p.provider, p.amount, p.status, p.failure_reason, p.created_at, (SELECT coalesce(sum(r.amount), 0) FROM refunds r WHERE r.payment_id = p.id AND r.status = 'PROCESSED') AS refunded_amount FROM payments p WHERE p.id = :id
get.payment.by-provider-order=SELECT id, booking_id, customer_id, purpose, provider, provider_order_id, amount, status FROM payments WHERE provider = :provider AND provider_order_id = :order FOR UPDATE
get.payment.customer-list=SELECT p.id, p.purpose, p.method, p.provider, p.amount, p.status, p.failure_reason, p.created_at, (SELECT coalesce(sum(r.amount), 0) FROM refunds r WHERE r.payment_id = p.id AND r.status = 'PROCESSED') AS refunded_amount FROM payments p JOIN bookings b ON b.id = p.booking_id WHERE p.booking_id = :b AND b.customer_id = :c ORDER BY p.created_at DESC
get.payment.pending-order=SELECT id, booking_id, customer_id, purpose, provider, provider_order_id, amount, status FROM payments WHERE booking_id = :b AND purpose = :purpose AND status = 'PENDING' AND provider = :provider ORDER BY created_at DESC LIMIT 1
get.payment.rework-payout-source=SELECT r.genie_id, r.booking_ref, o.genie_id AS original_genie_id, o.service_amount + o.travel_fee - o.commission_amount AS share FROM bookings r JOIN bookings o ON o.id = r.rework_of_id WHERE r.id = :id
lock.payment.by-id=SELECT id, booking_id, customer_id, purpose, provider, provider_order_id, amount, status FROM payments WHERE id = :id FOR UPDATE
insert.payment.cash=INSERT INTO payments (booking_id, customer_id, method, amount, status, purpose) VALUES (:b, :c, 'CASH', :amount, 'SUCCEEDED', 'BOOKING') RETURNING id
insert.payment.online-order=INSERT INTO payments (booking_id, customer_id, method, provider, provider_order_id, amount, status, purpose) VALUES (:b, :c, 'ONLINE', :provider, :order, :amount, 'PENDING', :purpose) RETURNING id
insert.payment.tip=INSERT INTO tips (booking_id, customer_id, amount) VALUES (:b, :c, :amount)
insert.payment.webhook-event=INSERT INTO webhook_events (provider, event_id) VALUES (:p, :e) ON CONFLICT DO NOTHING
update.payment.failed=UPDATE payments SET status = 'FAILED', failure_reason = :reason, updated_at = now() WHERE id = :id AND status = 'PENDING'
update.payment.succeeded=UPDATE payments SET status = 'SUCCEEDED', provider_ref = :ref, updated_at = now() WHERE id = :id

fragment.payout.select=SELECT p.id, p.genie_id, u.full_name AS genie_name, gp.payout_upi_id AS upi_id, p.period_start, p.period_end, p.amount, p.status, p.reference, p.created_at, p.paid_at FROM payouts p JOIN users u ON u.id = p.genie_id JOIN genie_profiles gp ON gp.user_id = p.genie_id
fragment.payout.status-filter=WHERE (CAST(:status AS varchar) IS NULL OR p.status = :status)
get.payout.by-id=${fragment.payout.select} WHERE p.id = :id
get.payout.genie-ids=SELECT DISTINCT genie_id FROM ledger_entries WHERE genie_id IS NOT NULL
get.payout.list=${fragment.payout.select} ${fragment.payout.status-filter} ORDER BY p.created_at DESC LIMIT :limit OFFSET :offset
get.payout.pending-total=SELECT coalesce(sum(amount), 0) FROM payouts WHERE genie_id = :g AND status = 'PENDING'
count.payout.list=SELECT count(*) FROM payouts p ${fragment.payout.status-filter}
exists.payout.genie=SELECT EXISTS (SELECT 1 FROM genie_profiles WHERE user_id = :g)
lock.payout.by-id=SELECT genie_id, amount, status FROM payouts WHERE id = :id FOR UPDATE
insert.payout.create=INSERT INTO payouts (genie_id, period_start, period_end, amount, status) VALUES (:g, :start, :end, :amount, 'PENDING') ON CONFLICT (genie_id, period_start, period_end) DO NOTHING
update.payout.failed=UPDATE payouts SET status = 'FAILED', reference = :reason WHERE id = :id AND status = 'PENDING'
update.payout.paid=UPDATE payouts SET status = 'PAID', reference = :ref, paid_at = now() WHERE id = :id

fragment.receipt.row=SELECT id, number, kind, booking_id, payment_id, refund_id, customer_id, amount, tax::text AS tax, file_key, issued_at FROM receipts
get.receipt.for-booking=SELECT id, number, kind, booking_id, payment_id, refund_id, amount, issued_at FROM receipts WHERE booking_id = :b AND (CAST(:c AS uuid) IS NULL OR customer_id = :c) ORDER BY issued_at
get.receipt.for-customer=SELECT id, number, kind, booking_id, payment_id, refund_id, amount, issued_at FROM receipts WHERE customer_id = :c ORDER BY issued_at
get.receipt.number-for-payment=SELECT number FROM receipts WHERE payment_id = :p AND kind = 'RECEIPT'
get.receipt.payment-details=SELECT id, purpose, method, provider, provider_ref, amount, updated_at FROM payments WHERE id = :id
get.receipt.refund-details=SELECT reason, method, manual_reference FROM refunds WHERE id = :id
get.receipt.row=${fragment.receipt.row} WHERE id = :id
get.receipt.source=SELECT b.id AS booking_id, b.booking_ref, b.customer_id, cu.full_name AS customer_name, cu.email AS customer_email, cu.phone AS customer_phone, gu.full_name AS genie_name, s.name AS service, b.slot_start, b.address_snapshot ->> 'area' AS area, b.address_snapshot ->> 'city' AS city, b.address_snapshot ->> 'pincode' AS pincode, b.service_amount, b.travel_fee, b.extra_amount, b.extra_note, b.tip_amount, b.cancellation_fee FROM bookings b JOIN users cu ON cu.id = b.customer_id JOIN users gu ON gu.id = b.genie_id JOIN services s ON s.id = b.service_id WHERE b.id = :id
exists.receipt.for-payment=SELECT EXISTS (SELECT 1 FROM receipts WHERE payment_id = :id AND kind = 'RECEIPT')
exists.receipt.for-refund=SELECT EXISTS (SELECT 1 FROM receipts WHERE refund_id = :id)
insert.receipt.credit-note=INSERT INTO receipts (number, kind, booking_id, payment_id, refund_id, customer_id, amount, tax, gstin) VALUES (:n, 'CREDIT_NOTE', :b, :p, :r, :c, :amount, CAST(:tax AS jsonb), :gstin) RETURNING id
insert.receipt.payment=INSERT INTO receipts (number, kind, booking_id, payment_id, customer_id, amount, tax, gstin) VALUES (:n, 'RECEIPT', :b, :p, :c, :amount, CAST(:tax AS jsonb), :gstin) RETURNING id
update.receipt.file-key=UPDATE receipts SET file_key = :k WHERE id = :id

fragment.refund.select=SELECT id, payment_id, booking_id, amount, genie_share, platform_share, reason, method, status, provider_refund_id, manual_reference, failure_reason, ticket_id, created_at, processed_at FROM refunds
get.refund.by-id=${fragment.refund.select} WHERE id = :id
get.refund.by-provider-id=SELECT r.id, r.booking_id, r.status FROM refunds r JOIN payments p ON p.id = r.payment_id WHERE r.provider_refund_id = :r AND p.provider = :provider FOR UPDATE OF r
get.refund.committed-total=SELECT coalesce(sum(amount), 0) FROM refunds WHERE payment_id = :p AND status IN ('PENDING', 'PROCESSED')
get.refund.for-booking=${fragment.refund.select} WHERE booking_id = :b ORDER BY created_at DESC
get.refund.for-processing=SELECT id, payment_id, amount, genie_share, platform_share, method, status FROM refunds WHERE id = :id
get.refund.payment=SELECT id, booking_id, customer_id, purpose, method, provider, provider_ref, amount, status FROM payments WHERE id = :id
get.refund.processed-total=SELECT coalesce(sum(amount), 0) FROM refunds WHERE payment_id = :p AND status = 'PROCESSED'
lock.refund.payment=SELECT id, booking_id, customer_id, purpose, method, provider, provider_ref, amount, status FROM payments WHERE id = :id FOR UPDATE
insert.refund.create=INSERT INTO refunds (payment_id, booking_id, amount, genie_share, platform_share, reason, method, manual_reference, ticket_id, initiated_by) VALUES (:p, :b, :amount, :g, :pl, :reason, :method, :ref, :ticket, :admin) RETURNING id
update.refund.failed=UPDATE refunds SET status = 'FAILED', failure_reason = :reason WHERE id = :id
update.refund.payment-refunded=UPDATE payments SET status = 'REFUNDED', updated_at = now() WHERE id = :id
update.refund.processed=UPDATE refunds SET status = 'PROCESSED', processed_at = now() WHERE id = :id
update.refund.provider-id=UPDATE refunds SET provider_refund_id = :r WHERE id = :id

fragment.wallet.accounts=('GENIE_EARNINGS', 'TIPS', 'GENIE_CASH', 'PAYOUT', 'SETTLEMENT')
get.wallet.balance=SELECT coalesce(sum(CASE direction WHEN 'C' THEN amount ELSE -amount END), 0) FROM ledger_entries WHERE genie_id = :g AND account IN ${fragment.wallet.accounts}
get.wallet.earnings-since=SELECT coalesce(sum(amount), 0) FROM ledger_entries WHERE genie_id = :g AND direction = 'C' AND account IN ('GENIE_EARNINGS', 'TIPS') AND created_at >= :since
get.wallet.entries=SELECT le.id, b.booking_ref, le.account, le.direction, le.amount, le.description, le.created_at FROM ledger_entries le LEFT JOIN bookings b ON b.id = le.booking_id WHERE le.genie_id = :g AND le.account IN ${fragment.wallet.accounts} ORDER BY le.created_at DESC, le.id DESC LIMIT :limit OFFSET :offset
get.wallet.lifetime-earnings=SELECT coalesce(sum(amount), 0) FROM ledger_entries WHERE genie_id = :g AND direction = 'C' AND account IN ('GENIE_EARNINGS', 'TIPS')
get.wallet.payouts=${fragment.payout.select} WHERE p.genie_id = :g ORDER BY p.period_end DESC LIMIT 52
count.wallet.completed-jobs-since=SELECT count(*) FROM bookings WHERE genie_id = :g AND status = 'COMPLETED' AND completed_at >= :since
count.wallet.entries=SELECT count(*) FROM ledger_entries WHERE genie_id = :g AND account IN ${fragment.wallet.accounts}

# ====================================================================================================
# Pricing
# ====================================================================================================

get.pricing.estimate=SELECT coalesce(gs.price_override, s.base_price) AS service_price, (ST_Distance(gp.base_location, ST_SetSRID(ST_MakePoint(:lng, :lat), 4326)::geography) / 1000.0)::numeric(8,2) AS straight_km, cp.commission_rate, cp.travel_free_km, cp.travel_base_fee, cp.travel_per_km, cp.travel_fee_cap FROM genie_profiles gp JOIN genie_services gs      ON gs.genie_id = gp.user_id AND gs.service_id = :serviceId AND gs.is_active JOIN services s             ON s.id = gs.service_id JOIN genie_service_areas ga ON ga.genie_id = gp.user_id JOIN city_pricing cp        ON cp.city_id = ga.city_id WHERE gp.user_id = :genieId AND gp.verification_status = 'APPROVED' LIMIT 1

# ====================================================================================================
# Genies: directory, profile, documents, verification
# ====================================================================================================

fragment.genie.card-group-by=GROUP BY u.id, u.full_name, gp.bio, gp.experience_years, gp.avg_rating, gp.rating_count, gp.completed_jobs, gp.base_area, gp.is_online
fragment.genie.card-select=SELECT u.id, u.full_name, gp.bio, gp.experience_years, gp.avg_rating, gp.rating_count, gp.completed_jobs, gp.base_area, gp.is_online AS online, min(coalesce(gs.price_override, s.base_price)) AS starting_price, string_agg(DISTINCT c.name, ', ')              AS categories, min(c.slug)                                    AS category_slug, min(c.image_url)                               AS cover_image FROM genie_profiles gp JOIN users u               ON u.id = gp.user_id AND u.status = 'ACTIVE' JOIN genie_services gs     ON gs.genie_id = gp.user_id AND gs.is_active JOIN services s            ON s.id = gs.service_id AND s.is_active JOIN service_categories c  ON c.id = s.category_id WHERE gp.verification_status = 'APPROVED'
fragment.genie.filter-category=AND c.slug = :category
fragment.genie.filter-service=AND s.id = :serviceId
fragment.genie.order-experience=experience_years DESC
fragment.genie.order-price=starting_price ASC
fragment.genie.order-rating=avg_rating DESC, rating_count DESC
get.genie.bookable-offer=SELECT gp.user_id AS genie_id, u.full_name AS genie_name, gp.verification_status, u.status AS user_status, s.id AS service_id, s.name AS service_name, s.duration_minutes, coalesce(gs.price_override, s.base_price) AS price, gp.service_radius_km FROM genie_profiles gp JOIN users u ON u.id = gp.user_id LEFT JOIN genie_services gs ON gs.genie_id = gp.user_id AND gs.service_id = :serviceId AND gs.is_active LEFT JOIN services s        ON s.id = gs.service_id AND s.is_active WHERE gp.user_id = :genieId
get.genie.card=${fragment.genie.card-select} AND gp.user_id = :id ${fragment.genie.card-group-by}
get.genie.cards=${fragment.genie.card-select} AND gp.user_id IN (:ids) ${fragment.genie.card-group-by}
get.genie.detail-reviews=SELECT r.rating, r.comment, split_part(u.full_name, ' ', 1) AS customer_name, r.created_at, r.genie_reply FROM reviews r JOIN users u ON u.id = r.customer_id WHERE r.genie_id = :id ORDER BY r.created_at DESC LIMIT 10
get.genie.detail-services=SELECT s.id AS service_id, s.name, coalesce(gs.price_override, s.base_price) AS price, s.duration_minutes FROM genie_services gs JOIN services s ON s.id = gs.service_id WHERE gs.genie_id = :id AND gs.is_active AND s.is_active ORDER BY price
get.genie.list=${fragment.genie.card-select} {{categoryFilter}} {{serviceFilter}} ${fragment.genie.card-group-by} ORDER BY {{orderBy}} LIMIT :limit
get.genie.serves-location=SELECT coalesce(ST_DWithin(gp.base_location, ST_SetSRID(ST_MakePoint(:lng, :lat), 4326)::geography, gp.service_radius_km * 1000), FALSE) FROM genie_profiles gp WHERE gp.user_id = :id
get.genie.time-off-between=SELECT starts_at, ends_at FROM genie_time_off WHERE genie_id = :id AND starts_at < :to AND ends_at > :from
get.genie.weekly-availability=SELECT day_of_week, start_time, end_time FROM genie_availability WHERE genie_id = :id
exists.genie.listed=SELECT EXISTS (SELECT 1 FROM genie_profiles gp JOIN users u ON u.id = gp.user_id WHERE gp.user_id = :id AND gp.verification_status = 'APPROVED' AND u.status = 'ACTIVE')

get.genie-document.file=SELECT object_key, coalesce(content_type, 'application/octet-stream') AS content_type, coalesce(file_name, doc_type || '-' || id) AS file_name FROM genie_documents WHERE id = :id AND (CAST(:owner AS uuid) IS NULL OR genie_id = :owner)
get.genie-document.list=SELECT id, doc_type, masked_number, status, file_name, content_type, size_bytes, review_note, created_at FROM genie_documents WHERE genie_id = :id ORDER BY created_at DESC
get.genie-document.owned=SELECT object_key, status FROM genie_documents WHERE id = :id AND genie_id = :g
insert.genie-document.upload=INSERT INTO genie_documents (id, genie_id, doc_type, object_key, masked_number, status, file_name, content_type, size_bytes) VALUES (:id, :g, :type, :key, :masked, 'PENDING', :name, :ct, :size) RETURNING id, doc_type, masked_number, status, file_name, content_type, size_bytes, review_note, created_at
update.genie-document.approve-pending=UPDATE genie_documents SET status = 'APPROVED', reviewed_by = :admin, reviewed_at = now() WHERE genie_id = :id AND status = 'PENDING'
update.genie-document.review=UPDATE genie_documents SET status = :status, review_note = :note, reviewed_by = :admin, reviewed_at = now() WHERE id = :id
delete.genie-document.by-id=DELETE FROM genie_documents WHERE id = :id

get.genie-profile.active-services-by-ids=SELECT id, base_price FROM services WHERE is_active AND id IN (:ids)
get.genie-profile.availability=SELECT day_of_week, start_time, end_time FROM genie_availability WHERE genie_id = :id ORDER BY day_of_week, start_time
get.genie-profile.me=SELECT u.id, u.full_name, u.phone, u.email, gp.bio, gp.experience_years, gp.verification_status, gp.verification_note, gp.base_area, ST_Y(gp.base_location::geometry) AS base_lat, ST_X(gp.base_location::geometry) AS base_lng, gp.service_radius_km, gp.payout_upi_id, gp.is_online AS online, gp.avg_rating, gp.rating_count, gp.completed_jobs, gp.cancellation_count, gp.submitted_at, gp.approved_at FROM genie_profiles gp JOIN users u ON u.id = gp.user_id WHERE gp.user_id = :id
get.genie-profile.services=SELECT s.id AS service_id, s.name, c.name AS category_name, s.base_price, gs.price_override, coalesce(gs.price_override, s.base_price) AS price, s.duration_minutes FROM genie_services gs JOIN services s           ON s.id = gs.service_id JOIN service_categories c ON c.id = s.category_id WHERE gs.genie_id = :id AND gs.is_active ORDER BY c.sort_order, s.base_price
get.genie-profile.status=SELECT verification_status FROM genie_profiles WHERE user_id = :id
get.genie-profile.upcoming-time-off=SELECT id, starts_at, ends_at, reason FROM genie_time_off WHERE genie_id = :id AND ends_at > now() ORDER BY starts_at
exists.genie-profile.by-id=SELECT EXISTS (SELECT 1 FROM genie_profiles WHERE user_id = :id)
lock.genie-profile.status=SELECT verification_status FROM genie_profiles WHERE user_id = :id FOR UPDATE
insert.genie-profile.availability=INSERT INTO genie_availability (genie_id, day_of_week, start_time, end_time) VALUES (:g, :d, :s, :e)
insert.genie-profile.register=INSERT INTO genie_profiles (user_id, verification_status) VALUES (:id, 'REGISTERED')
insert.genie-profile.service=INSERT INTO genie_services (genie_id, service_id, price_override) VALUES (:g, :s, :p)
insert.genie-profile.service-areas=INSERT INTO genie_service_areas (genie_id, city_id) SELECT :id, c.id FROM cities c WHERE c.is_active AND c.center IS NOT NULL ORDER BY ST_Distance(c.center, ST_SetSRID(ST_MakePoint(:lng, :lat), 4326)::geography) LIMIT 1
insert.genie-profile.time-off=INSERT INTO genie_time_off (genie_id, starts_at, ends_at, reason) VALUES (:g, :s, :e, :r) RETURNING id, starts_at, ends_at, reason
upsert.genie-profile.location=INSERT INTO genie_locations (genie_id, location, accuracy_m, updated_at) VALUES (:id, ST_SetSRID(ST_MakePoint(:lng, :lat), 4326)::geography, :acc, now()) ON CONFLICT (genie_id) DO UPDATE SET location = EXCLUDED.location, accuracy_m = EXCLUDED.accuracy_m, updated_at = now()
update.genie-profile.cancellation=UPDATE genie_profiles SET cancellation_count = cancellation_count + 1, updated_at = now() WHERE user_id = :id
update.genie-profile.clear-flag=UPDATE genie_profiles SET flagged_at = NULL, flag_reason = NULL WHERE user_id = :id
update.genie-profile.completed-job=UPDATE genie_profiles SET completed_jobs = completed_jobs + 1, updated_at = now() WHERE user_id = :id
update.genie-profile.decision=UPDATE genie_profiles SET verification_status = :to, verification_note = :note, is_online = CASE WHEN :to = 'APPROVED' THEN is_online ELSE FALSE END, approved_at = CASE WHEN :decision = 'APPROVE' THEN now() ELSE approved_at END, approved_by = CASE WHEN :decision = 'APPROVE' THEN CAST(:admin AS uuid) ELSE approved_by END, flagged_at = CASE WHEN :decision = 'REINSTATE' THEN NULL ELSE flagged_at END, flag_reason = CASE WHEN :decision = 'REINSTATE' THEN NULL ELSE flag_reason END, updated_at = now() WHERE user_id = :id
update.genie-profile.details=UPDATE genie_profiles SET bio = :bio, experience_years = :experience, base_area = :area, base_location = ST_SetSRID(ST_MakePoint(:lng, :lat), 4326)::geography, service_radius_km = :radius, payout_upi_id = :upi, updated_at = now() WHERE user_id = :id
update.genie-profile.flag=UPDATE genie_profiles SET flagged_at = now(), flag_reason = :reason, updated_at = now() WHERE user_id = :id AND flagged_at IS NULL
update.genie-profile.online=UPDATE genie_profiles SET is_online = :online, updated_at = now() WHERE user_id = :id
update.genie-profile.rating=UPDATE genie_profiles gp SET avg_rating = coalesce(r.avg_rating, 0), rating_count = coalesce(r.cnt, 0), updated_at = now() FROM (SELECT round(avg(rating)::numeric, 1) AS avg_rating, count(*) AS cnt FROM reviews WHERE genie_id = :id) r WHERE gp.user_id = :id
update.genie-profile.submit=UPDATE genie_profiles SET verification_status = 'UNDER_REVIEW', submitted_at = now(), updated_at = now() WHERE user_id = :id
delete.genie-profile.availability=DELETE FROM genie_availability WHERE genie_id = :id
delete.genie-profile.service-areas=DELETE FROM genie_service_areas WHERE genie_id = :id
delete.genie-profile.services=DELETE FROM genie_services WHERE genie_id = :id
delete.genie-profile.time-off=DELETE FROM genie_time_off WHERE id = :id AND genie_id = :g

count.genie-strike.recent=SELECT count(*) FROM genie_strikes WHERE genie_id = :g AND created_at > now() - interval '90 days'
insert.genie-strike.add=INSERT INTO genie_strikes (genie_id, ticket_id, reason, created_by) VALUES (:g, :t, :r, :a)

fragment.genie-verification.queue-where=WHERE (CAST(:status AS varchar) IS NULL OR gp.verification_status = :status) AND (CAST(:flagged AS boolean) IS NULL OR (gp.flagged_at IS NOT NULL) = :flagged) AND (CAST(:q AS varchar) IS NULL OR u.full_name ILIKE :q OR u.phone LIKE :q)
get.genie-verification.events=SELECT e.from_status, e.to_status, e.reason, a.full_name AS actor_name, e.created_at FROM genie_verification_events e LEFT JOIN users a ON a.id = e.actor_id WHERE e.genie_id = :id ORDER BY e.created_at DESC, e.id DESC
get.genie-verification.flags=SELECT u.status AS user_status, gp.flagged_at, gp.flag_reason FROM genie_profiles gp JOIN users u ON u.id = gp.user_id WHERE gp.user_id = :id
get.genie-verification.queue=SELECT u.id, u.full_name, u.phone, gp.base_area, gp.verification_status, gp.submitted_at, gp.created_at, (SELECT count(*) FROM genie_services gs WHERE gs.genie_id = gp.user_id AND gs.is_active) AS service_count, (SELECT count(*) FROM genie_documents d WHERE d.genie_id = gp.user_id AND d.status = 'PENDING') AS pending_documents, gp.flagged_at, gp.flag_reason FROM genie_profiles gp JOIN users u ON u.id = gp.user_id ${fragment.genie-verification.queue-where} ORDER BY gp.flagged_at DESC NULLS LAST, gp.submitted_at ASC NULLS LAST, gp.created_at DESC LIMIT :limit OFFSET :offset
count.genie-verification.queue=SELECT count(*) FROM genie_profiles gp JOIN users u ON u.id = gp.user_id ${fragment.genie-verification.queue-where}
insert.genie-verification.event=INSERT INTO genie_verification_events (genie_id, from_status, to_status, reason, actor_id) VALUES (:id, :from, :to, :reason, :admin)
insert.genie-verification.flag-cleared=INSERT INTO genie_verification_events (genie_id, from_status, to_status, reason, actor_id) VALUES (:id, :s, :s, 'Reliability flag cleared', :admin)
insert.genie-verification.registered=INSERT INTO genie_verification_events (genie_id, from_status, to_status, reason, actor_id) VALUES (:id, NULL, 'REGISTERED', 'Account created', :id)
insert.genie-verification.submitted=INSERT INTO genie_verification_events (genie_id, from_status, to_status, reason, actor_id) VALUES (:id, :from, 'UNDER_REVIEW', 'Submitted for review', :id)

get.user.full-name=SELECT full_name FROM users WHERE id = :id

# ====================================================================================================
# Reviews
# ====================================================================================================

fragment.review.select=SELECT r.id, r.booking_id, b.booking_ref, s.name AS service_name, r.rating, r.comment, split_part(u.full_name, ' ', 1) AS customer_name, r.created_at, r.genie_reply, r.replied_at FROM reviews r JOIN bookings b ON b.id = r.booking_id JOIN services s ON s.id = b.service_id JOIN users u    ON u.id = r.customer_id
get.review.by-id=${fragment.review.select} WHERE r.id = :id
get.review.for-genie=${fragment.review.select} WHERE r.genie_id = :g ORDER BY r.created_at DESC LIMIT :limit OFFSET :offset
count.review.for-genie=SELECT count(*) FROM reviews WHERE genie_id = :g
exists.review.owned=SELECT EXISTS (SELECT 1 FROM reviews WHERE id = :id AND genie_id = :g)
insert.review.create=INSERT INTO reviews (booking_id, customer_id, genie_id, rating, comment) VALUES (:b, :c, :g, :rating, :comment) RETURNING id
update.review.reply=UPDATE reviews SET genie_reply = :reply, replied_at = now() WHERE id = :id AND genie_id = :g AND genie_reply IS NULL

# ====================================================================================================
# Complaints (tickets) and the contact inbox
# ====================================================================================================

fragment.contact-message.status-filter=WHERE (CAST(:status AS varchar) IS NULL OR status = :status)
get.contact-message.list=SELECT id, name, email, phone, subject, message, status, created_at, resolved_at FROM contact_messages ${fragment.contact-message.status-filter} ORDER BY created_at DESC LIMIT :limit OFFSET :offset
count.contact-message.list=SELECT count(*) FROM contact_messages ${fragment.contact-message.status-filter}
insert.contact-message.create=INSERT INTO contact_messages (name, email, phone, subject, message) VALUES (:name, :email, :phone, :subject, :message)
update.contact-message.status=UPDATE contact_messages SET status = :status, resolved_at = CASE WHEN :status = 'RESOLVED' THEN now() ELSE NULL END WHERE id = :id RETURNING id, name, email, phone, subject, message, status, created_at, resolved_at

fragment.ticket.admin-queue-where=WHERE (:status = 'ALL' OR t.status = :status OR (:status = 'ACTIVE' AND t.status IN ('OPEN', 'IN_REVIEW', 'AWAITING_REPLY'))) AND (CAST(:priority AS varchar) IS NULL OR t.priority = :priority) AND (CAST(:type AS varchar) IS NULL OR t.type = :type) AND (NOT :mine OR t.assigned_to = :admin) AND (CAST(:q AS varchar) IS NULL OR t.ticket_ref ILIKE :q OR b.booking_ref ILIKE :q OR t.subject ILIKE :q OR ru.full_name ILIKE :q) {{overdueFilter}}
fragment.ticket.find-select=SELECT t.id, t.ticket_ref, t.type, t.booking_id, b.booking_ref, b.customer_id, b.genie_id, t.raised_by, t.raised_by_role, t.category, t.priority, t.status, t.subject, t.first_responded_at, t.resolved_at, t.version FROM tickets t LEFT JOIN bookings b ON b.id = t.booking_id WHERE t.id = :id
fragment.ticket.mine-where=WHERE (t.raised_by = :u OR b.customer_id = :u OR b.genie_id = :u) AND (CAST(:status AS varchar) IS NULL OR t.status = :status OR (:status = 'ACTIVE' AND t.status IN ('OPEN', 'IN_REVIEW', 'AWAITING_REPLY')))
fragment.ticket.overdue=(t.status IN ('OPEN', 'IN_REVIEW', 'AWAITING_REPLY') AND (t.resolution_due < now() OR (t.first_responded_at IS NULL AND t.first_response_due < now())))
fragment.ticket.overdue-only=AND ${fragment.ticket.overdue}
fragment.ticket.summary-select=SELECT t.id, t.ticket_ref, t.type, t.booking_id, b.booking_ref, t.category, t.priority, t.status, t.subject, t.raised_by, ru.full_name AS raised_by_name, t.raised_by_role, au.full_name AS assigned_to_name, t.first_response_due, t.resolution_due, ${fragment.ticket.overdue} AS overdue, t.created_at, t.updated_at FROM tickets t LEFT JOIN bookings b ON b.id = t.booking_id JOIN users ru ON ru.id = t.raised_by LEFT JOIN users au ON au.id = t.assigned_to
get.ticket.admin-queue=${fragment.ticket.summary-select} ${fragment.ticket.admin-queue-where} ORDER BY overdue DESC, CASE t.priority WHEN 'URGENT' THEN 0 WHEN 'HIGH' THEN 1 ELSE 2 END, t.resolution_due, t.created_at LIMIT :limit OFFSET :offset
get.ticket.attachment=SELECT file_key, file_name, content_type FROM ticket_attachments WHERE id = :id AND ticket_id = :t
get.ticket.attachments=SELECT id, file_name, content_type, size_bytes, uploaded_by, created_at FROM ticket_attachments WHERE ticket_id = :t ORDER BY created_at
get.ticket.booking-payment=SELECT id FROM payments WHERE booking_id = :b AND status = 'SUCCEEDED' ORDER BY CASE purpose WHEN 'BOOKING' THEN 0 ELSE 1 END, created_at DESC LIMIT 1
get.ticket.by-id=${fragment.ticket.find-select}
get.ticket.detail=SELECT t.id, t.ticket_ref, t.type, t.booking_id, b.booking_ref, s.name AS service_name, b.customer_id, cu.full_name AS customer_name, b.genie_id, gu.full_name AS genie_name, t.category, t.priority, t.status, t.subject, t.description, t.raised_by, ru.full_name AS raised_by_name, t.raised_by_role, t.assigned_to, au.full_name AS assigned_to_name, t.first_response_due, t.resolution_due, ${fragment.ticket.overdue} AS overdue, t.first_responded_at, t.resolved_at, t.closed_at, t.resolution_actions, t.resolution_note, t.refund_id, t.redo_booking_id, rb.booking_ref AS redo_booking_ref, t.created_at FROM tickets t LEFT JOIN bookings b ON b.id = t.booking_id LEFT JOIN services s ON s.id = b.service_id LEFT JOIN users cu ON cu.id = b.customer_id LEFT JOIN users gu ON gu.id = b.genie_id JOIN users ru ON ru.id = t.raised_by LEFT JOIN users au ON au.id = t.assigned_to LEFT JOIN bookings rb ON rb.id = t.redo_booking_id WHERE t.id = :id
get.ticket.messages=SELECT m.id, m.author_id, coalesce(u.full_name, 'ProGenie') AS author_name, m.author_role, m.body, m.internal, m.created_at FROM ticket_messages m LEFT JOIN users u ON u.id = m.author_id WHERE m.ticket_id = :id AND (:admin OR NOT m.internal) ORDER BY m.created_at, m.id
get.ticket.mine=${fragment.ticket.summary-select} ${fragment.ticket.mine-where} ORDER BY t.updated_at DESC LIMIT :limit OFFSET :offset
get.ticket.next-ref=SELECT nextval('ticket_ref_seq')
count.ticket.admin-queue=SELECT count(*) FROM tickets t LEFT JOIN bookings b ON b.id = t.booking_id JOIN users ru ON ru.id = t.raised_by ${fragment.ticket.admin-queue-where}
count.ticket.attachments=SELECT count(*) FROM ticket_attachments WHERE ticket_id = :t
count.ticket.mine=SELECT count(*) FROM tickets t LEFT JOIN bookings b ON b.id = t.booking_id ${fragment.ticket.mine-where}
exists.ticket.open-for-booking=SELECT EXISTS (SELECT 1 FROM tickets WHERE booking_id = :b AND status IN ('OPEN', 'IN_REVIEW', 'AWAITING_REPLY'))
lock.ticket.booking-for-raise=SELECT id, booking_ref, customer_id, genie_id, status, slot_start, slot_end, accepted_at FROM bookings WHERE id = :id FOR UPDATE
lock.ticket.by-id=${fragment.ticket.find-select} FOR UPDATE OF t
insert.ticket.attachment=INSERT INTO ticket_attachments (id, ticket_id, uploaded_by, file_key, file_name, content_type, size_bytes) VALUES (:id, :t, :u, :k, :n, :ct, :size)
insert.ticket.create=INSERT INTO tickets (ticket_ref, type, booking_id, raised_by, raised_by_role, category, priority, subject, description, first_response_due, resolution_due) VALUES (:ref, :type, :b, :u, :role, :cat, :prio, :subject, :desc, :frd, :rd) RETURNING id
insert.ticket.message=INSERT INTO ticket_messages (ticket_id, author_id, author_role, body, internal) VALUES (:t, :a, :r, :b, :i)
update.ticket.accept=UPDATE tickets SET status = 'CLOSED', closed_at = now(), updated_at = now(), version = version + 1 WHERE id = :id
update.ticket.admin-reply=UPDATE tickets SET first_responded_at = coalesce(first_responded_at, now()), assigned_to = coalesce(assigned_to, :admin), status = :status, updated_at = now(), version = version + 1 WHERE id = :id
update.ticket.assign=UPDATE tickets SET assigned_to = :a, status = CASE WHEN status = 'OPEN' THEN 'IN_REVIEW' ELSE status END, updated_at = now(), version = version + 1 WHERE id = :id
update.ticket.close-settled=UPDATE tickets SET status = 'CLOSED', closed_at = now(), updated_at = now(), version = version + 1 WHERE status IN ('RESOLVED', 'REJECTED') AND resolved_at < now() - interval '7 days'
update.ticket.reject=UPDATE tickets SET status = 'REJECTED', resolved_at = now(), resolution_note = :note, resolution_actions = 'REJECTED', first_responded_at = coalesce(first_responded_at, now()), assigned_to = coalesce(assigned_to, :admin), updated_at = now(), version = version + 1 WHERE id = :id
update.ticket.reopen=UPDATE tickets SET status = 'IN_REVIEW', closed_at = NULL, updated_at = now(), version = version + 1 WHERE id = :id
update.ticket.resolve=UPDATE tickets SET status = 'RESOLVED', resolved_at = now(), resolution_actions = :actions, resolution_note = :note, refund_id = coalesce(:refund, refund_id), redo_booking_id = coalesce(:redo, redo_booking_id), first_responded_at = coalesce(first_responded_at, now()), assigned_to = coalesce(assigned_to, :admin), updated_at = now(), version = version + 1 WHERE id = :id
update.ticket.status=UPDATE tickets SET status = :s, updated_at = now(), version = version + 1 WHERE id = :id
update.ticket.touch=UPDATE tickets SET updated_at = now() WHERE id = :id

exists.user.active-admin=SELECT EXISTS (SELECT 1 FROM users WHERE id = :id AND role = 'ADMIN' AND status = 'ACTIVE')

# ====================================================================================================
# JPQL for Spring Data repositories (@Query(name = ...)): entity names, not tables
# ====================================================================================================

lock.booking.entity=select b from Booking b where b.id = :id

update.refresh-token.revoke-all-for-user=update RefreshToken t set t.revokedAt = :now where t.userId = :userId and t.revokedAt is null and (:keepFamilyId is null or t.familyId <> :keepFamilyId)
update.refresh-token.revoke-family=update RefreshToken t set t.revokedAt = :now where t.familyId = :familyId and t.revokedAt is null
