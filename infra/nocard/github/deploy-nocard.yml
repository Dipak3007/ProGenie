name: deploy-nocard

# Free, no-card SIT (docs/DEPLOYMENT_NOCARD.md): front end on Cloudflare Workers, back end on a Hugging Face Space.
# Copy this file to .github/workflows/, then run it from Actions → deploy-nocard → Run workflow.
#
# Repository secrets: HF_TOKEN (the progenie-deploy token: write access to the Space), CLOUDFLARE_API_TOKEN,
#                     CLOUDFLARE_ACCOUNT_ID
# Repository variables: HF_SPACE (e.g. dipak/progenie-api), DB_REPO (e.g. dipak3007/ProGenieV2-Database),
#                       BACKEND_URL (e.g. https://dipak-progenie-api.hf.space)
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [both, backend, frontend]
        default: both

concurrency:
  group: deploy-nocard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    if: inputs.target != 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Send the Space files (Hugging Face builds the image itself)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          APP_REPO: ${{ github.repository }}
          APP_REF: ${{ github.sha }}
          DB_REPO: ${{ vars.DB_REPO }}
        run: bash infra/nocard/scripts/push-hf-space.sh

  frontend:
    if: inputs.target != 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Build and deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: bash infra/nocard/scripts/deploy-web.sh
