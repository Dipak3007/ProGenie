# ProGenie local stack.
#
#   Infra only (you run api + web from your IDE / terminal):
#     docker compose up -d
#
#   Everything in containers (like production):
#     docker compose --profile app up -d --build
#
#   Optional S3-compatible file storage (SeaweedFS). The API uses it when started with PROGENIE_STORAGE_TYPE=s3
#   (see docs/LOCAL_SETUP.md, "S3 storage"); otherwise files stay in api/data/uploads:
#     docker compose --profile storage up -d
#
#   Optional road distance for the travel fee (OSRM, Gujarat roads). Prepare the data once with
#   bash osrm/prepare.sh, then start the API with PROGENIE_DISTANCE_PROVIDER=osrm (docs/LOCAL_SETUP.md, "Road distance"):
#     docker compose --profile osrm up -d
#
# Redis (always started) is used only when the API runs with PROGENIE_CACHE_TYPE=redis; the default read cache is in memory.
#
# Ports: web 8088 · api 8080 · postgres 5432 · redis 6379 · mailpit 8025 · s3 8333 · osrm 5000

name: progenie

services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: progenie-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-progenie}
      POSTGRES_USER: ${POSTGRES_USER:-progenie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-progenie}
      TZ: Asia/Kolkata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-progenie} -d ${POSTGRES_DB:-progenie}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: progenie-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage for uploads, receipts and exports, like Supabase Storage on the SIT.
  # MinIO no longer publishes its community image on Docker Hub, so we use SeaweedFS.
  # Only started with:  docker compose --profile storage up -d
  # Local credentials (seaweedfs/s3.json): access key progenie-local, secret progenie-local-secret.
  # The API creates the bucket "progenie" on first start (S3_CREATE_BUCKET=true).
  s3:
    profiles: ["storage"]
    image: chrislusf/seaweedfs:3.80
    container_name: progenie-s3
    command: server -dir=/data -volume.max=30 -master.volumeSizeLimitMB=64 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API: http://localhost:8333
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  # Road routing for the travel fee. Needs the prepared data in osrm/data (bash osrm/prepare.sh; about 1-2 GB RAM).
  # Only started with:  docker compose --profile osrm up -d
  osrm:
    profiles: ["osrm"]
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: progenie-osrm
    command: osrm-routed --algorithm mld /data/region.osrm
    ports:
      - "5000:5000"   # http://localhost:5000/route/v1/driving/72.505,23.04;72.561,23.035
    volumes:
      - ./osrm/data:/data:ro
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: progenie-mailpit
    ports:
      - "8025:8025"   # web inbox: http://localhost:8025
      - "1025:1025"   # SMTP
    restart: unless-stopped

  # ---------------------------------------------------------------- application (profile "app")
  api:
    profiles: ["app"]
    build: ../api
    container_name: progenie-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-progenie}
      DB_USER: ${POSTGRES_USER:-progenie}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-progenie}
      PROGENIE_DB_MIGRATIONS: filesystem:/db/migrations
      PROGENIE_CORS_ALLOWED_ORIGINS: http://localhost:8088
      PROGENIE_JWT_PRIVATE_KEY: ${PROGENIE_JWT_PRIVATE_KEY:-}
      PROGENIE_JWT_PUBLIC_KEY: ${PROGENIE_JWT_PUBLIC_KEY:-}
      PROGENIE_STORAGE_DIR: /data/uploads
      # Files: local (the volume below) or s3 (start the "storage" profile too)
      PROGENIE_STORAGE_TYPE: ${PROGENIE_STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      S3_BUCKET: ${S3_BUCKET:-progenie}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-progenie-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-progenie-local-secret}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}
      # Read cache: memory (default) or redis (the redis service above; also holds the rate limits then)
      PROGENIE_CACHE_TYPE: ${PROGENIE_CACHE_TYPE:-memory}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Travel fee distance: straight (line x 1.3) or osrm (start the "osrm" profile too)
      PROGENIE_DISTANCE_PROVIDER: ${PROGENIE_DISTANCE_PROVIDER:-straight}
      PROGENIE_OSRM_URL: ${PROGENIE_OSRM_URL:-http://osrm:5000}
      PROGENIE_PAYMENT_WEBHOOK_SECRET: ${PROGENIE_PAYMENT_WEBHOOK_SECRET:-local-dev-webhook-secret}
      PROGENIE_WEB_BASE_URL: http://localhost:${WEB_PORT:-8088}
      # Accounts and messages (SMS / WhatsApp / email go to Mailpit unless a provider is set to msg91)
      PROGENIE_OTP_PEPPER: ${PROGENIE_OTP_PEPPER:-local-dev-otp-pepper-change-me}
      PROGENIE_MAILPIT_URL: http://mailpit:8025
      PROGENIE_SMS_PROVIDER: ${PROGENIE_SMS_PROVIDER:-mailpit}
      PROGENIE_WHATSAPP_PROVIDER: ${PROGENIE_WHATSAPP_PROVIDER:-mailpit}
      PROGENIE_EMAIL_PROVIDER: ${PROGENIE_EMAIL_PROVIDER:-mailpit}
      PROGENIE_MAIL_FROM: ${PROGENIE_MAIL_FROM:-no-reply@progenie.in}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
      MSG91_WHATSAPP_NUMBER: ${MSG91_WHATSAPP_NUMBER:-}
      MSG91_EMAIL_DOMAIN: ${MSG91_EMAIL_DOMAIN:-}
      MSG91_WEBHOOK_TOKEN: ${MSG91_WEBHOOK_TOKEN:-}
      # Payments (the fake gateway stays the default until Razorpay keys are set)
      PROGENIE_PAYMENT_GATEWAY: ${PROGENIE_PAYMENT_GATEWAY:-fake}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PROGENIE_TAX_GST_ENABLED: ${PROGENIE_TAX_GST_ENABLED:-false}
      PROGENIE_TAX_GSTIN: ${PROGENIE_TAX_GSTIN:-}
      PROGENIE_TAX_SAC: ${PROGENIE_TAX_SAC:-}
      PROGENIE_TAX_RATE: ${PROGENIE_TAX_RATE:-18}
      # Company details for receipts and the legal pages' placeholders
      PROGENIE_COMPANY_LEGAL_NAME: ${PROGENIE_COMPANY_LEGAL_NAME:-}
      PROGENIE_COMPANY_ADDRESS: ${PROGENIE_COMPANY_ADDRESS:-}
      PROGENIE_COMPANY_CITY: ${PROGENIE_COMPANY_CITY:-Ahmedabad}
      PROGENIE_SUPPORT_EMAIL: ${PROGENIE_SUPPORT_EMAIL:-support@progenie.in}
      PROGENIE_SUPPORT_PHONE: ${PROGENIE_SUPPORT_PHONE:-}
      PROGENIE_COMPANY_GRIEVANCE_NAME: ${PROGENIE_COMPANY_GRIEVANCE_NAME:-}
      PROGENIE_COMPANY_GRIEVANCE_EMAIL: ${PROGENIE_COMPANY_GRIEVANCE_EMAIL:-grievance@progenie.in}
    volumes:
      # The DDL + Day-0 scripts live in the sibling folder ProGenie_DB_Scripts
      - ${PROGENIE_DB_DIR:-../../ProGenie_DB_Scripts}/migrations:/db/migrations:ro
      # KYC documents uploaded by Genies (kept across container restarts)
      - uploads:/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    profiles: ["app"]
    build: ../web
    container_name: progenie-web
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
  uploads:
